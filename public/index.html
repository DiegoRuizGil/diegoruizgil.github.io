<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<title>Diego Ruiz Gil - Portfolio</title>
		<script>
			// Apply saved/system theme before first paint to avoid a flash.
			(function () {
				try {
					var saved = localStorage.getItem("theme");
					var dark =
						saved === "dark" ||
						(!saved &&
							window.matchMedia &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
				} catch (e) {}
			})();
		</script>
		<script>
			// Counterpart of 404.html: turn /?/articles/my-post back into
			// /articles/my-post before the app starts (GitHub Pages routing).
			(function (l) {
				if (l.search[1] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (s) {
							return s.replace(/~and~/g, "&");
						})
						.join("?");
					window.history.replaceState(
						null,
						null,
						l.pathname.slice(0, -1) + decoded + l.hash
					);
				}
			})(window.location);
		</script>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>
</html>
